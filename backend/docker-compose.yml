services:
  db:
    image: postgres:16
    container_name: tpi-foodstore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodstore
      POSTGRES_PASSWORD: foodstore
      POSTGRES_DB: foodstore_db
    ports:
      - "5437:5432"
    volumes:
      - foodstore_pgdata:/var/lib/postgresql/data

volumes:
  foodstore_pgdata:
